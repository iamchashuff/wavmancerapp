<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-title" content="Wavmancer">

<title>Wavmancer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
/* ── THEME VARS (light + dark) ── */
:root{
  --acc:#c9383a;
  --bg:#0a0a0c;
  --text:#e8e6e0;
  --text2:#b0aead;
  --surf:#111114;
  --surf2:#18181d;
  --surf3:#1e1e24;
  --bord:#2a2a33;
  --muted:#6b6970;
  --ck:#0a0a0c;
  --shadow:rgba(0,0,0,.4);
}
.light{
  --bg:#f2f1ee;
  --text:#1a1818;
  --text2:#4a4846;
  --surf:#ffffff;
  --surf2:#ebebea;
  --surf3:#e2e1de;
  --bord:#d4d2ce;
  --muted:#8a8784;
  --ck:#ffffff;
  --shadow:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;transition:background .3s}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;overflow-x:hidden}
#app{min-height:100vh}

/* ── FIELDS ── */
.field{width:100%;background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:11px 12px;font-family:'DM Mono',monospace;font-size:13px;color:var(--text);outline:none;margin-bottom:10px;-webkit-appearance:none;transition:border-color .2s,background .3s,color .3s}
.field:focus{border-color:var(--acc)}
.field::placeholder{color:var(--muted)}
textarea.field{resize:vertical}
select.field{cursor:pointer}

/* ── BUTTONS ── */
.btn-p{width:100%;padding:12px;background:var(--acc);color:#fff;border:none;border-radius:6px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:opacity .2s,transform .1s}
.btn-p:active{opacity:.8;transform:scale(.98)}
.btn-p:disabled{opacity:.5}
.btn-o{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:10px 14px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;width:100%;margin-top:8px;transition:all .2s}
.btn-g{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;padding:10px}
.btn-s{padding:7px 12px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;border:none;background:var(--acc);color:#fff;transition:opacity .15s}
.btn-s:active{opacity:.8}
.btn-s.o{background:none;border:1px solid var(--bord);color:var(--muted)}
.btn-s.d{background:rgba(224,112,112,.12);color:#e07070;border:1px solid rgba(224,112,112,.25)}
.btn-google{width:100%;padding:11px;background:var(--surf2);border:1px solid var(--bord);border-radius:6px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;transition:background .2s}
.iBtn{background:none;border:none;cursor:pointer;padding:8px;color:var(--muted);line-height:1;font-size:20px;transition:color .15s}
.iBtn:active{opacity:.6}

/* ── STATUS / MISC ── */
.err{font-size:11px;color:#e07070;background:rgba(224,112,112,.1);border:1px solid rgba(224,112,112,.2);border-radius:4px;padding:8px 10px;margin-bottom:10px;display:none}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;background:var(--bg)}
.loading-w{font-family:'Bebas Neue',sans-serif;font-size:64px;color:var(--acc);animation:pulse 1.4s ease infinite}
.loading-t{font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.empty{color:var(--muted);font-size:12px;padding:24px 0;text-align:center;line-height:1.6}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:10px;transition:background .3s,border-color .3s}
.slabel{font-size:10px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--bord)}
.flabel{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
.badge{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px}

/* ── TASK ROW ── */
.trow{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:var(--surf2);border-radius:5px;margin-bottom:6px;min-height:42px;transition:background .15s}
.trow:active{background:var(--surf3)}
.tcheck{width:18px;height:18px;border:1.5px solid var(--bord);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tcheck.on{background:var(--acc);border-color:var(--acc)}
.tcheck.on::after{content:'✓';font-size:11px;color:var(--ck);font-weight:700}

/* ── SONG CARDS ── */
.scard{background:var(--surf);border:1px solid var(--bord);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:all .2s}
.sheader{display:flex;align-items:center;padding:13px 13px 11px;gap:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.drag-handle{cursor:grab;padding:4px 6px;color:var(--muted);font-size:16px;touch-action:none;opacity:.5}
.scard.dragging{opacity:.4;transform:scale(.98)}
.scard.drag-over{border-top:2px solid var(--acc)}

/* ── NAV DRAWER ── */
#nav-drawer{position:fixed;top:0;left:0;width:240px;height:100%;background:var(--surf);border-right:1px solid var(--bord);z-index:200;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1),background .3s,border-color .3s;overflow-y:auto;padding-bottom:40px}
#nav-drawer.open{transform:translateX(0);box-shadow:4px 0 24px var(--shadow)}
#nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#nav-overlay.open{display:block}
.nav-head{padding:44px 18px 16px;border-bottom:1px solid var(--bord);margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 18px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:color .15s,background .15s;border-left:3px solid transparent}
.nav-item:active{background:var(--surf2)}
.nav-item.on{color:var(--text);background:var(--surf2);border-left-color:var(--acc)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.nav-item.on .nav-dot{transform:scale(1.3)}
.nav-section{font-size:9px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;padding:14px 18px 5px;opacity:.55}

/* ── MODAL ── */
#modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal-box{background:var(--surf);border:1px solid var(--bord);border-radius:18px 18px 0 0;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp .22s cubic-bezier(.4,0,.2,1);transition:background .3s}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.05em;margin-bottom:16px;color:var(--text)}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ── FAB ── */
#fab{position:fixed;bottom:24px;right:20px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:26px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px var(--shadow);transition:transform .15s,box-shadow .15s}
#fab:active{transform:scale(.92);box-shadow:0 2px 10px var(--shadow)}
#fab.show{display:flex}

/* ── RELEASE TABLE ── */
.rel-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--bord);margin-bottom:14px}
.rel-table{width:100%;border-collapse:collapse;font-size:11px}
.rel-table th{background:var(--surf2);color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1px solid var(--bord);white-space:nowrap}
.rel-table td{padding:10px;border-bottom:1px solid var(--bord);vertical-align:middle;color:var(--text)}
.rel-table tr:last-child td{border-bottom:none}
.rel-table tbody tr{transition:background .1s}
.rel-table tbody tr:active td{background:var(--surf2)}
.rel-chip{font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;display:inline-block}

/* ── MISC ── */
.progress-bar{background:var(--surf2);border-radius:3px;height:5px;overflow:hidden;margin-bottom:5px}
.progress-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{text-align:center}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.mini-stat{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:12px 14px;cursor:pointer;transition:background .15s}
.mini-stat:active{background:var(--surf2)}
a.link-btn{display:flex;align-items:center;justify-content:center;padding:8px 12px;background:var(--surf2);border:1px solid var(--bord);border-radius:5px;font-size:11px;text-decoration:none;font-family:'DM Mono',monospace;transition:background .15s;gap:6px}
a.link-btn:active{background:var(--surf3)}
.divider{height:1px;background:var(--bord);margin:12px 0}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="loading-w">W</div><div class="loading-t">Loading</div></div></div>
<div id="nav-overlay" onclick="closeNav()"></div>
<div id="nav-drawer"></div>
<button id="fab" onclick="fabAction()">+</button>
<div id="modal-ov" onclick="if(event.target===this)CM()"><div id="modal-box"></div></div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyC6yanZh8cHOBC9NgXsW93ft3x7pqW9pYQ",
  authDomain:"wavmancer-899fa.firebaseapp.com",
  projectId:"wavmancer-899fa",
  storageBucket:"wavmancer-899fa.firebasestorage.app",
  messagingSenderId:"311113252923",
  appId:"1:311113252923:web:c8a96080700d3829745c1e"
});
const auth=firebase.auth(),db=firebase.firestore(),stor=firebase.storage();
const IPINFO_TOKEN='9445a4621618c3';
let CU=null,CP=null,CID=null,PL=null,VO=false,TAB='overview',OC={},dragSrc=null,musicSub='songs',showArchive={};

/* ── THEME ── */
function applyTheme(dark){
  document.body.classList.toggle('light',!dark);
  document.documentElement.style.setProperty('--bg', dark?'#0a0a0c':'#f2f1ee');
}

auth.onAuthStateChanged(u=>{CU=u;route();});
function route(){
  const h=location.hash;
  if(h.startsWith('#/view/'))loadView(h.replace('#/view/',''));
  else if(h.startsWith('#/project/')&&CU)openP(h.replace('#/project/',''));
  else if(CU)dash();
  else authScreen();
}
window.addEventListener('hashchange',route);

/* ── SWIPE NAV ── */
let _swX=0,_swY=0;
const TABS_ORDER=['overview','music','release','campaign','plan','budget','contacts','info'];
document.addEventListener('touchstart',e=>{_swX=e.touches[0].clientX;_swY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!CP||VO)return;
  const dx=e.changedTouches[0].clientX-_swX;
  const dy=e.changedTouches[0].clientY-_swY;
  if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx)*1.2)return;
  const cur=TAB==='music'?'music':'overview';
  const tabs=TABS_ORDER;
  const ci=tabs.indexOf(TAB);
  if(ci<0)return;
  if(dx<-50&&ci<tabs.length-1)sT(tabs[ci+1]);
  else if(dx>50&&ci>0)sT(tabs[ci-1]);
},{passive:true});

/* ── NAV DRAWER ── */
const NAV_ITEMS=[
  {id:'overview',label:'Overview',dot:'#4caf82',section:null},
  {id:'music',label:'Music',dot:'var(--acc)',section:'Production'},
  {id:'release',label:'Release Schedule',dot:'#4a8fc4',section:'Release'},
  {id:'campaign',label:'Content Campaign',dot:'#e84393',section:null},
  {id:'plan',label:'Plan & Milestones',dot:'#d4a843',section:'General'},
  {id:'budget',label:'Budget',dot:'#4caf82',section:null},
  {id:'contacts',label:'Contacts',dot:'#4a8fc4',section:null},
  {id:'info',label:'Info & Notes',dot:'var(--muted)',section:null},
  {id:'insights',label:'Insights',dot:'#8b68d4',section:'Analytics'},
];

function openNav(){
  var p=CP;
  var items=NAV_ITEMS.filter(function(t){return !(VO&&t.id==='insights');});
  var lastSec=null;
  var html='';
  items.forEach(function(t){
    if(t.section&&t.section!==lastSec){
      lastSec=t.section;
      html+='<div class="nav-section">'+t.section+'</div>';
    }
    var on=TAB===t.id;
    html+='<button class="nav-item'+(on?' on':'')+'" onclick="sT(\''+t.id+'\');closeNav()">';
    html+='<div class="nav-dot" style="background:'+(on?'var(--acc)':t.dot)+'"></div>';
    html+=t.label;
    html+='</button>';
  });
  var dark=p&&p.theme&&p.theme.dark!==false;
  var navHead='<div class="nav-head">';
  navHead+='<div style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;letter-spacing:.06em;color:var(--acc)">Wavmancer</div>';
  navHead+='<div style="font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((p&&p.title)||'')+'</div>';
  if(!VO){
    navHead+='<div style="display:flex;gap:8px;margin-top:14px">';
    navHead+='<button onclick="toggleDark();closeNav()" style="flex:1;padding:7px;background:var(--surf2);border:1px solid var(--bord);border-radius:5px;font-family:\'DM Mono\',monospace;font-size:10px;color:var(--text);cursor:pointer">'+(dark?'☀ Light':'🌙 Dark')+'</button>';
    navHead+='<button onclick="settingsM();closeNav()" style="flex:1;padding:7px;background:var(--surf2);border:1px solid var(--bord);border-radius:5px;font-family:\'DM Mono\',monospace;font-size:10px;color:var(--text);cursor:pointer">⚙ Settings</button>';
    navHead+='</div>';
  }
  navHead+='</div>';
  document.getElementById('nav-drawer').innerHTML=navHead+html;
  document.getElementById('nav-drawer').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
}

function closeNav(){
  document.getElementById('nav-drawer').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
}

/* ── FAB ── */
const FAB_ACTIONS={
  music:()=>addSongM(),
  release:()=>addReleaseRowM(),
  campaign:()=>addCampaignItemM(),
  plan:()=>addPlanItemM(),
  budget:()=>addExpModal(),
  contacts:()=>addContactM(),
};
function fabAction(){
  const fn=FAB_ACTIONS[TAB]||(TAB==='overview'?()=>newProjM():null);
  if(fn)fn();
}
function updateFab(){
  const fab=document.getElementById('fab');
  if(!fab)return;
  if(CP&&!VO&&FAB_ACTIONS[TAB]){fab.classList.add('show');}
  else{fab.classList.remove('show');}
}

/* ── AUTH ── */
function authScreen(){
  var mode='login';
  var h='';
  h+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)">';
  h+='<div style="text-align:center;margin-bottom:32px">';
  h+='<div style="font-family:\'Bebas Neue\',sans-serif;font-size:72px;color:var(--acc);line-height:1;letter-spacing:.02em">W</div>';
  h+='<div style="font-family:\'Bebas Neue\',sans-serif;font-size:36px;letter-spacing:.12em;color:var(--text)">Wavmancer</div>';
  h+='<div style="font-size:10px;color:var(--muted);letter-spacing:.25em;text-transform:uppercase;margin-top:5px">Music Production Tracker</div>';
  h+='</div>';
  h+='<div style="background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:24px;width:100%;max-width:380px;box-shadow:0 8px 32px var(--shadow)">';
  h+='<div style="display:flex;margin-bottom:18px;border-bottom:1px solid var(--bord)">';
  h+='<button id="tl" style="flex:1;padding:11px;background:none;border:none;border-bottom:2px solid var(--acc);color:var(--acc);font-family:\'DM Mono\',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer" onclick="setMode(\'login\')">Sign In</button>';
  h+='<button id="ts" style="flex:1;padding:11px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:\'DM Mono\',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer" onclick="setMode(\'signup\')">Sign Up</button>';
  h+='</div>';
  h+='<div id="nrow" style="display:none"><input class="field" id="aname" placeholder="Your name" autocomplete="name"></div>';
  h+='<input class="field" id="aemail" type="email" placeholder="Email address" autocomplete="email">';
  h+='<input class="field" id="apass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doA()">';
  h+='<div class="err" id="aerr"></div>';
  h+='<button class="btn-p" id="abtn" onclick="doA()">Sign In</button>';
  h+='<div style="text-align:center;font-size:10px;color:var(--muted);margin:14px 0;letter-spacing:.1em">or</div>';
  h+='<button class="btn-google" onclick="gAuth()">';
  h+='<svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.4 0-11.8-3.7-13.6-9.2l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';
  h+='Continue with Google</button>';
  h+='</div></div>';
  setA(h);
  window.setMode=function(m){
    mode=m;
    document.getElementById('tl').style.cssText='flex:1;padding:11px;background:none;border:none;border-bottom:2px solid '+(m==='login'?'var(--acc)':'transparent')+';color:'+(m==='login'?'var(--acc)':'var(--muted)')+';font-family:\'DM Mono\',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer';
    document.getElementById('ts').style.cssText='flex:1;padding:11px;background:none;border:none;border-bottom:2px solid '+(m==='signup'?'var(--acc)':'transparent')+';color:'+(m==='signup'?'var(--acc)':'var(--muted)')+';font-family:\'DM Mono\',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer';
    document.getElementById('nrow').style.display=m==='signup'?'block':'none';
    document.getElementById('abtn').textContent=m==='signup'?'Create Account':'Sign In';
    document.getElementById('apass').autocomplete=m==='signup'?'new-password':'current-password';
  };
  window.doA=async function(){
    var email=g('aemail'),pass=g('apass'),btn=document.getElementById('abtn');
    document.getElementById('aerr').style.display='none';
    if(!email||!pass)return sErr('aerr','Enter email and password.');
    btn.disabled=true;btn.textContent='...';
    try{
      if(mode==='signup'){var name=g('aname');var c=await auth.createUserWithEmailAndPassword(email,pass);if(name)await c.user.updateProfile({displayName:name});}
      else await auth.signInWithEmailAndPassword(email,pass);
      dash();

function initDrag(){
  document.querySelectorAll('.scard').forEach(el=>{
    el.addEventListener('touchstart',e=>{if(!e.target.classList.contains('drag-handle'))return;e.preventDefault();dragSrc=el.id.replace('sc-','');el.classList.add('dragging');},{passive:false});
  });
}
function dStart(e,id){dragSrc=id;e.dataTransfer.effectAllowed='move';}
function dOver(e,id){e.preventDefault();if(dragSrc&&dragSrc!==id){document.querySelectorAll('.scard').forEach(c=>c.classList.remove('drag-over'));const t=document.getElementById('sc-'+id);if(t)t.classList.add('drag-over');}}
function dEnd(){dragSrc=null;document.querySelectorAll('.scard').forEach(c=>{c.classList.remove('dragging');c.classList.remove('drag-over');});}
async function dDrop(e,tid){
  e.preventDefault();if(!dragSrc||dragSrc===tid)return;
  const songs=[...(CP.songs||[])];
  const fi=songs.findIndex(s=>s.id===dragSrc),ti=songs.findIndex(s=>s.id===tid);
  if(fi<0||ti<0)return;
  const [m]=songs.splice(fi,1);songs.splice(ti,0,m);
  songs.forEach((s,idx)=>s.order=idx+1);
  await db.collection('projects').doc(CID).update({songs});dEnd();
}

/* ── EXPORT STATUS ── */
function exportStatusM(){
  var p=CP;
  var songs=p.songs||[];
  var now=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

  var songTasks=[];
  songs.forEach(function(s){(s.tasks||[]).forEach(function(t){songTasks.push({done:t.done});});});
  var promoT=p.promoTasks||[],contentT=p.contentTasks||[],todoT=p.todoTasks||[];
  var mileT=p.milestones||[];
  var totalDone=songTasks.filter(function(t){return t.done;}).length+promoT.filter(function(t){return t.done;}).length+contentT.filter(function(t){return t.done;}).length+todoT.filter(function(t){return t.done;}).length+mileT.filter(function(m){return m.done;}).length;
  var totalAll=songTasks.length+promoT.length+contentT.length+todoT.length+mileT.length;
  var pct=totalAll?Math.round(totalDone/totalAll*100):0;

  var lines=[];
  lines.push((p.title||'Project')+' — Status Update');
  lines.push(now);
  lines.push('');
  lines.push('Overall: '+pct+'% complete ('+totalDone+'/'+totalAll+' tasks)');
  if(p.deadline){
    var dl=daysLeft(p.deadline);
    lines.push('Deadline: '+fmtDate(p.deadline)+(dl!==null?' ('+( dl<0?Math.abs(dl)+'d overdue':dl===0?'today':dl+'d left')+')':''));
  }

  lines.push('');
  lines.push('SONGS');
  songs.forEach(function(s){
    var dt=(s.tasks||[]).filter(function(t){return t.done;}).length;
    var tot=(s.tasks||[]).length;
    var done=tot>0&&dt===tot;
    lines.push('  '+(done?'✓':'○')+' '+s.name+' — '+(done?'Complete':s.statusLabel||'In Progress')+(tot?' ('+dt+'/'+tot+')':''));
  });

  if(mileT.length){
    lines.push('');
    lines.push('MILESTONES');
    mileT.forEach(function(m){lines.push('  '+(m.done?'✓':'○')+' '+m.label);});
  }

  var incPromo=promoT.filter(function(t){return !t.done;});
  var incContent=contentT.filter(function(t){return !t.done;});
  var incTodo=todoT.filter(function(t){return !t.done;});
  if(incPromo.length||incContent.length||incTodo.length){
    lines.push('');
    lines.push('REMAINING');
    incPromo.forEach(function(t){lines.push('  [Promo] '+t.text);});
    incContent.forEach(function(t){lines.push('  [Content] '+t.text);});
    incTodo.forEach(function(t){lines.push('  [To-Do] '+t.text);});
  }

  var txt=lines.join('\n');
  SM('<div class="modal-title">Status Export</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Copy and paste into a text, email, or Slack.</div>'
    +'<textarea class="field" id="exp-txt" style="min-height:200px;font-size:11px;line-height:1.7" readonly>'+esc(txt)+'</textarea>'
    +'<button class="btn-p" id="exp-btn" style="margin-top:4px" onclick="copyExport()">Copy to Clipboard</button>'
    +'<div class="mactions"><button class="btn-g" onclick="CM()">Close</button></div>');
}
function copyExport(){
  var el=document.getElementById('exp-txt');
  if(!el)return;
  navigator.clipboard.writeText(el.value).then(function(){
    var b=document.getElementById('exp-btn');
    if(b){b.textContent='✓ Copied!';setTimeout(function(){b.textContent='Copy to Clipboard';},2000);}
  });
}

async function togglePlanItem(src,id){
  if(src==='plan'){
    var items=[].concat(CP.planItems||[]);
    var i=items.findIndex(function(x){return x.id===id;});
    if(i<0)return;items[i].done=!items[i].done;
    await db.collection('projects').doc(CID).update({planItems:items});
  } else if(src==='milestone'){
    var ms=[].concat(CP.milestones||[]);
    var i=ms.findIndex(function(m){return m.id===id;});
    if(i<0)return;ms[i].done=!ms[i].done;
    await db.collection('projects').doc(CID).update({milestones:ms});
  } else if(src==='todo'){
    var ts=[].concat(CP.todoTasks||[]);
    var i=ts.findIndex(function(t){return t.id===id;});
    if(i<0)return;ts[i].done=!ts[i].done;
    await db.collection('projects').doc(CID).update({todoTasks:ts});
  }
}
async function delPlanItem(src,id){
  if(src==='plan'){
    await db.collection('projects').doc(CID).update({planItems:(CP.planItems||[]).filter(function(x){return x.id!==id;})});
  } else if(src==='milestone'){
    await db.collection('projects').doc(CID).update({milestones:(CP.milestones||[]).filter(function(m){return m.id!==id;})});
  } else if(src==='todo'){
    await db.collection('projects').doc(CID).update({todoTasks:(CP.todoTasks||[]).filter(function(t){return t.id!==id;})});
  }
}

function fmtDate(d){if(!d)return '';try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}}
