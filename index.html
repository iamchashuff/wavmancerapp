<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wavmancer">
<meta name="theme-color" content="#0a0a0c">
<title>Wavmancer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
/* ── THEME VARS (light + dark) ── */
:root{
  --acc:#c9383a;
  --bg:#0a0a0c;
  --text:#e8e6e0;
  --text2:#b0aead;
  --surf:#111114;
  --surf2:#18181d;
  --surf3:#1e1e24;
  --bord:#2a2a33;
  --muted:#6b6970;
  --ck:#0a0a0c;
  --shadow:rgba(0,0,0,.4);
}
.light{
  --bg:#f2f1ee;
  --text:#1a1818;
  --text2:#4a4846;
  --surf:#ffffff;
  --surf2:#ebebea;
  --surf3:#e2e1de;
  --bord:#d4d2ce;
  --muted:#8a8784;
  --ck:#ffffff;
  --shadow:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;transition:background .3s}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;overflow-x:hidden}
#app{min-height:100vh}

/* ── FIELDS ── */
.field{width:100%;background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:11px 12px;font-family:'DM Mono',monospace;font-size:13px;color:var(--text);outline:none;margin-bottom:10px;-webkit-appearance:none;transition:border-color .2s,background .3s,color .3s}
.field:focus{border-color:var(--acc)}
.field::placeholder{color:var(--muted)}
textarea.field{resize:vertical}
select.field{cursor:pointer}

/* ── BUTTONS ── */
.btn-p{width:100%;padding:12px;background:var(--acc);color:#fff;border:none;border-radius:6px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:opacity .2s,transform .1s}
.btn-p:active{opacity:.8;transform:scale(.98)}
.btn-p:disabled{opacity:.5}
.btn-o{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:10px 14px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;width:100%;margin-top:8px;transition:all .2s}
.btn-g{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;padding:10px}
.btn-s{padding:7px 12px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;border:none;background:var(--acc);color:#fff;transition:opacity .15s}
.btn-s:active{opacity:.8}
.btn-s.o{background:none;border:1px solid var(--bord);color:var(--muted)}
.btn-s.d{background:rgba(224,112,112,.12);color:#e07070;border:1px solid rgba(224,112,112,.25)}
.btn-google{width:100%;padding:11px;background:var(--surf2);border:1px solid var(--bord);border-radius:6px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;transition:background .2s}
.iBtn{background:none;border:none;cursor:pointer;padding:8px;color:var(--muted);line-height:1;font-size:20px;transition:color .15s}
.iBtn:active{opacity:.6}

/* ── STATUS / MISC ── */
.err{font-size:11px;color:#e07070;background:rgba(224,112,112,.1);border:1px solid rgba(224,112,112,.2);border-radius:4px;padding:8px 10px;margin-bottom:10px;display:none}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;background:var(--bg)}
.loading-w{font-family:'Bebas Neue',sans-serif;font-size:64px;color:var(--acc);animation:pulse 1.4s ease infinite}
.loading-t{font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.empty{color:var(--muted);font-size:12px;padding:24px 0;text-align:center;line-height:1.6}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:10px;transition:background .3s,border-color .3s}
.slabel{font-size:10px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--bord)}
.flabel{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
.badge{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px}

/* ── TASK ROW ── */
.trow{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:var(--surf2);border-radius:5px;margin-bottom:6px;min-height:42px;transition:background .15s}
.trow:active{background:var(--surf3)}
.tcheck{width:18px;height:18px;border:1.5px solid var(--bord);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tcheck.on{background:var(--acc);border-color:var(--acc)}
.tcheck.on::after{content:'✓';font-size:11px;color:var(--ck);font-weight:700}

/* ── SONG CARDS ── */
.scard{background:var(--surf);border:1px solid var(--bord);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:all .2s}
.sheader{display:flex;align-items:center;padding:13px 13px 11px;gap:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.drag-handle{cursor:grab;padding:4px 6px;color:var(--muted);font-size:16px;touch-action:none;opacity:.5}
.scard.dragging{opacity:.4;transform:scale(.98)}
.scard.drag-over{border-top:2px solid var(--acc)}

/* ── NAV DRAWER ── */
#nav-drawer{position:fixed;top:0;left:0;width:240px;height:100%;background:var(--surf);border-right:1px solid var(--bord);z-index:200;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1),background .3s,border-color .3s;overflow-y:auto;padding-bottom:40px}
#nav-drawer.open{transform:translateX(0);box-shadow:4px 0 24px var(--shadow)}
#nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#nav-overlay.open{display:block}
.nav-head{padding:44px 18px 16px;border-bottom:1px solid var(--bord);margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 18px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:color .15s,background .15s;border-left:3px solid transparent}
.nav-item:active{background:var(--surf2)}
.nav-item.on{color:var(--text);background:var(--surf2);border-left-color:var(--acc)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.nav-item.on .nav-dot{transform:scale(1.3)}
.nav-section{font-size:9px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;padding:14px 18px 5px;opacity:.55}

/* ── MODAL ── */
#modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal-box{background:var(--surf);border:1px solid var(--bord);border-radius:18px 18px 0 0;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp .22s cubic-bezier(.4,0,.2,1);transition:background .3s}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.05em;margin-bottom:16px;color:var(--text)}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ── FAB ── */
#fab{position:fixed;bottom:24px;right:20px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:26px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px var(--shadow);transition:transform .15s,box-shadow .15s}
#fab:active{transform:scale(.92);box-shadow:0 2px 10px var(--shadow)}
#fab.show{display:flex}

/* ── RELEASE TABLE ── */
.rel-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--bord);margin-bottom:14px}
.rel-table{width:100%;border-collapse:collapse;font-size:11px}
.rel-table th{background:var(--surf2);color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1px solid var(--bord);white-space:nowrap}
.rel-table td{padding:10px;border-bottom:1px solid var(--bord);vertical-align:middle;color:var(--text)}
.rel-table tr:last-child td{border-bottom:none}
.rel-table tbody tr{transition:background .1s}
.rel-table tbody tr:active td{background:var(--surf2)}
.rel-chip{font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;display:inline-block}

/* ── MISC ── */
.progress-bar{background:var(--surf2);border-radius:3px;height:5px;overflow:hidden;margin-bottom:5px}
.progress-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{text-align:center}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.mini-stat{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:12px 14px;cursor:pointer;transition:background .15s}
.mini-stat:active{background:var(--surf2)}
a.link-btn{display:flex;align-items:center;justify-content:center;padding:8px 12px;background:var(--surf2);border:1px solid var(--bord);border-radius:5px;font-size:11px;text-decoration:none;font-family:'DM Mono',monospace;transition:background .15s;gap:6px}
a.link-btn:active{background:var(--surf3)}
.divider{height:1px;background:var(--bord);margin:12px 0}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="loading-w">W</div><div class="loading-t">Loading</div></div></div>
<div id="nav-overlay" onclick="closeNav()"></div>
<div id="nav-drawer"></div>
<button id="fab" onclick="fabAction()">+</button>
<div id="modal-ov" onclick="if(event.target===this)CM()"><div id="modal-box"></div></div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyC6yanZh8cHOBC9NgXsW93ft3x7pqW9pYQ",
  authDomain:"wavmancer-899fa.firebaseapp.com",
  projectId:"wavmancer-899fa",
  storageBucket:"wavmancer-899fa.firebasestorage.app",
  messagingSenderId:"311113252923",
  appId:"1:311113252923:web:c8a96080700d3829745c1e"
});
const auth=firebase.auth(),db=firebase.firestore(),stor=firebase.storage();
const IPINFO_TOKEN='9445a4621618c3';
let CU=null,CP=null,CID=null,PL=null,VO=false,TAB='overview',OC={},dragSrc=null,musicSub='songs';

/* ── THEME ── */
function applyTheme(dark){
  document.body.classList.toggle('light',!dark);
  document.documentElement.style.setProperty('--bg', dark?'#0a0a0c':'#f2f1ee');
}

auth.onAuthStateChanged(u=>{CU=u;route();});
function route(){
  const h=location.hash;
  if(h.startsWith('#/view/'))loadView(h.replace('#/view/',''));
  else if(h.startsWith('#/project/')&&CU)openP(h.replace('#/project/',''));
  else if(CU)dash();
  else authScreen();
}
window.addEventListener('hashchange',route);

/* ── SWIPE NAV ── */
let _swX=0,_swY=0;
const TABS_ORDER=['overview','music','release','promo','content','todo','budget','info'];
document.addEventListener('touchstart',e=>{_swX=e.touches[0].clientX;_swY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!CP||VO)return;
  const dx=e.changedTouches[0].clientX-_swX;
  const dy=e.changedTouches[0].clientY-_swY;
  if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx)*1.2)return;
  const cur=TAB==='music'?'music':'overview';
  const tabs=TABS_ORDER;
  const ci=tabs.indexOf(TAB);
  if(ci<0)return;
  if(dx<-50&&ci<tabs.length-1)sT(tabs[ci+1]);
  else if(dx>50&&ci>0)sT(tabs[ci-1]);
},{passive:true});

/* ── NAV DRAWER ── */
const NAV_ITEMS=[
  {id:'overview',label:'Overview',dot:'#4caf82',section:null},
  {id:'music',label:'Songs',dot:'var(--acc)',section:'Production'},
  {id:'focus',label:'Focus',dot:'#d4a843',section:null},
  {id:'release',label:'Release Schedule',dot:'#4a8fc4',section:'Release & Promo'},
  {id:'promo',label:'Promo & Photos',dot:'#e07b3a',section:null},
  {id:'content',label:'Content',dot:'#8b68d4',section:null},
  {id:'todo',label:'To-Do',dot:'#4a8fc4',section:'General'},
  {id:'budget',label:'Budget',dot:'#4caf82',section:null},
  {id:'info',label:'Info & Notes',dot:'var(--muted)',section:null},
  {id:'insights',label:'Insights',dot:'#8b68d4',section:'Analytics'},
];

function openNav(){
  const p=CP;
  const items=NAV_ITEMS.filter(t=>!(VO&&t.id==='insights'));
  let lastSec=null;
  const html=items.map(t=>{
    let s='';
    if(t.section&&t.section!==lastSec){lastSec=t.section;s=`<div class="nav-section">${t.section}</div>`;}
    const on=TAB===t.id||(t.id==='focus'&&TAB==='music'&&musicSub==='focus');
    return s+`<button class="nav-item${on?' on':''}" onclick="sT('${t.id}');closeNav()">
      <div class="nav-dot" style="background:${on?'var(--acc)':t.dot}"></div>${t.label}
    </button>`;
  }).join('');
  const dark=p?.theme?.dark!==false;
  document.getElementById('nav-drawer').innerHTML=`
    <div class="nav-head">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;color:var(--acc)">Wavmancer</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p?.title||''}</div>
      ${!VO?`<div style="display:flex;gap:8px;margin-top:14px">
        <button onclick="toggleDark();closeNav()" style="flex:1;padding:7px;background:var(--surf2);border:1px solid var(--bord);border-radius:5px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text);cursor:pointer">${dark?'☀ Light':'🌙 Dark'}</button>
        <button onclick="settingsM();closeNav()" style="flex:1;padding:7px;background:var(--surf2);border:1px solid var(--bord);border-radius:5px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text);cursor:pointer">⚙ Settings</button>
      </div>`:''}
    </div>${html}`;
  document.getElementById('nav-drawer').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
}
function closeNav(){
  document.getElementById('nav-drawer').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
}

/* ── FAB ── */
const FAB_ACTIONS={
  music:()=>addSongM(),
  promo:()=>addSimpleTask('promoTasks','pt-inp',true),
  content:()=>addSimpleTask('contentTasks','ct-inp',true),
  todo:()=>addSimpleTask('todoTasks','td-inp',true),
  budget:()=>addExpModal(),
  release:()=>addReleaseRowM(),
  info:()=>addMilestoneM(),
};
function fabAction(){
  const fn=FAB_ACTIONS[TAB]||(TAB==='overview'?()=>newProjM():null);
  if(fn)fn();
}
function updateFab(){
  const fab=document.getElementById('fab');
  if(!fab)return;
  if(CP&&!VO&&FAB_ACTIONS[TAB]){fab.classList.add('show');}
  else{fab.classList.remove('show');}
}

/* ── AUTH ── */
function authScreen(){
  let mode='login';
  setA(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--acc);line-height:1;letter-spacing:.02em">W</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.12em;color:var(--text)">Wavmancer</div>
    <div style="font-size:10px;color:var(--muted);letter-spacing:.25em;text-transform:uppercase;margin-top:5px">Music Production Tracker</div>
  </div>
  <div style="background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:24px;width:100%;max-width:380px;box-shadow:0 8px 32px var(--shadow)">
    <div style="display:flex;margin-bottom:18px;border-bottom:1px solid var(--bord);gap:0">
      <button id="tl" style="flex:1;padding:11px;background:none;border:none;border-bottom:2px solid var(--acc);color:var(--acc);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer" onclick="setMode('login')">Sign In</button>
      <button id="ts" style="flex:1;padding:11px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer" onclick="setMode('signup')">Sign Up</button>
    </div>
    <div id="nrow" style="display:none"><input class="field" id="aname" placeholder="Your name" autocomplete="name"></div>
    <input class="field" id="aemail" type="email" placeholder="Email address" autocomplete="email">
    <input class="field" id="apass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doA()">
    <div class="err" id="aerr"></div>
    <button class="btn-p" id="abtn" onclick="doA()">Sign In</button>
    <div style="text-align:center;font-size:10px;color:var(--muted);margin:14px 0;letter-spacing:.1em">or</div>
    <button class="btn-google" onclick="gAuth()">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.4 0-11.8-3.7-13.6-9.2l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
  </div></div>`);
  window.setMode=m=>{
    mode=m;
    document.getElementById('tl').style.cssText=`flex:1;padding:11px;background:none;border:none;border-bottom:2px solid ${m==='login'?'var(--acc)':'transparent'};color:${m==='login'?'var(--acc)':'var(--muted)'};font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer`;
    document.getElementById('ts').style.cssText=`flex:1;padding:11px;background:none;border:none;border-bottom:2px solid ${m==='signup'?'var(--acc)':'transparent'};color:${m==='signup'?'var(--acc)':'var(--muted)'};font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer`;
    document.getElementById('nrow').style.display=m==='signup'?'block':'none';
    document.getElementById('abtn').textContent=m==='signup'?'Create Account':'Sign In';
    document.getElementById('apass').autocomplete=m==='signup'?'new-password':'current-password';
  };
  window.doA=async()=>{
    const email=g('aemail'),pass=g('apass'),btn=document.getElementById('abtn');
    document.getElementById('aerr').style.display='none';
    if(!email||!pass)return sErr('aerr','Enter email and password.');
    btn.disabled=true;btn.textContent='...';
    try{
      if(mode==='signup'){const name=g('aname');const c=await auth.createUserWithEmailAndPassword(email,pass);if(name)await c.user.updateProfile({displayName:name});}
      else await auth.signInWithEmailAndPassword(email,pass);
      dash();
    }catch(e){sErr('aerr',fE(e.code));btn.disabled=false;btn.textContent=mode==='signup'?'Create Account':'Sign In';}
  };
  window.gAuth=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());dash();}catch(e){sErr('aerr',fE(e.code));}};
}

/* ── DASH ── */
async function dash(){
  VO=false;location.hash='';stopL();CP=null;CID=null;
  document.getElementById('fab').classList.remove('show');
  setA(`<div style="padding:44px 16px 16px;background:linear-gradient(180deg,var(--surf) 0%,var(--bg) 100%);border-bottom:1px solid var(--bord)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.06em;line-height:1;color:var(--acc)">Wavmancer</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">${CU.displayName||CU.email}</div>
      </div>
      <button class="btn-s o" onclick="SO()" style="margin-top:4px">Sign Out</button>
    </div>
  </div>
  <div style="padding:16px">
    <button class="btn-p" onclick="newProjM()" style="margin-bottom:20px">+ New Project</button>
    <div class="slabel">Your Projects</div>
    <div id="plist"><div class="empty">Loading...</div></div>
  </div>`);
  try{
    const snap=await db.collection('projects').get();
    const el=document.getElementById('plist');if(!el)return;
    const ps=[];snap.forEach(d=>{const data=d.data();if(data.ownerId===CU.uid)ps.push({id:d.id,...data});});
    if(!ps.length){el.innerHTML='<div class="empty">No projects yet.<br>Create your first one above.</div>';return;}
    ps.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    el.innerHTML=ps.map((p,i)=>{
      const acc=p.theme?.accent||'#c9383a';
      const s=p.songs||[];
      const dn=s.filter(x=>(x.tasks||[]).every(t=>t.done)&&(x.tasks||[]).length>0).length;
      const pct=s.length?Math.round(dn/s.length*100):0;
      const dl=p.deadline?daysLeft(p.deadline):null;
      return `<div onclick="openP('${p.id}')" style="background:var(--surf);border:1px solid var(--bord);border-radius:10px;margin-bottom:10px;cursor:pointer;overflow:hidden;animation:fadeUp .3s ease ${i*.05}s backwards">
        <div style="height:3px;background:${acc};opacity:.6"></div>
        <div style="display:flex;align-items:center;gap:12px;padding:13px 14px">
          ${p.coverUrl?`<img src="${p.coverUrl}" style="width:50px;height:50px;border-radius:8px;object-fit:cover;flex-shrink:0">`:`<div style="width:50px;height:50px;border-radius:8px;background:${acc}18;border:1px solid ${acc}30;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px">♪</div>`}
          <div style="flex:1;min-width:0">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${p.title||'Untitled'}</div>
            <div style="font-size:10px;color:var(--muted);margin:3px 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${[p.artist,p.label].filter(Boolean).join(' · ')}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="flex:1;height:3px;background:var(--surf2);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${acc};border-radius:2px;transition:width .4s"></div></div>
              <span style="font-size:9px;color:var(--muted)">${dn}/${s.length}</span>
            </div>
            ${dl!==null?`<div style="font-size:9px;color:${dl<0?'#e07070':dl<7?'#d4a843':'var(--muted)'};margin-top:5px">${dl<0?`⚠ ${Math.abs(dl)}d overdue`:dl===0?'⚠ Due today':dl===1?'Tomorrow':dl<7?`${dl}d left`:`${dl} days left`}</div>`:''}
          </div>
          <div style="color:var(--muted);font-size:16px">›</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    const el=document.getElementById('plist');
    if(el)el.innerHTML=`<div class="empty" style="color:#e07070">Error loading.<br><small>${e.message}</small></div>`;
  }
}

  SM(`<div class="modal-title">New Project</div>
    <input class="field" id="nt" placeholder="EP / Album title" autofocus>
    <input class="field" id="na" placeholder="Artist name">
    <input class="field" id="nl" placeholder="Label (optional)">

async function cProj(){
  const title=g('nt');if(!title)return sErr('ne','Enter a project title.');
  try{
    const id='p'+Date.now();
    await db.collection('projects').doc(id).set({
      title,artist:g('na'),label:g('nl'),coproducer:g('nc'),
      deadline:document.getElementById('nd').value||null,
      ownerId:CU.uid,songs:[],focusDone:{},notes:'',coverUrl:null,
      milestones:[],expenses:[],views:[],promoTasks:[],contentTasks:[],todoTasks:[],releaseSchedule:[],

/* ── PROJECT ── */
function openP(pid){
  VO=false;TAB='overview';OC={};CID=pid;musicSub='songs';
  location.hash='#/project/'+pid;stopL();
  setA(`<div class="loading"><div class="loading-w">W</div><div class="loading-t">Loading</div></div>`);
  PL=db.collection('projects').doc(pid).onSnapshot(snap=>{
    if(!snap.data()){setA(`<div class="loading"><div class="loading-t" style="color:#e07070">Not found.<br><button class="btn-s o" onclick="dash()" style="margin-top:12px">← Back</button></div></div>`);return;}
    CP={id:snap.id,...snap.data()};
    applyTheme(CP.theme?.dark!==false);
    rP();
  },err=>setA(`<div class="loading" style="padding:30px;text-align:center"><div style="color:#e07070;font-size:12px">${err.message}</div><button class="btn-s o" onclick="dash()" style="margin-top:12px">← Back</button></div>`));
}
function loadView(pid){
  VO=true;TAB='overview';OC={};musicSub='songs';stopL();
  setA(`<div class="loading"><div class="loading-w">W</div><div class="loading-t">Loading</div></div>`);
  logView(pid);
  PL=db.collection('projects').doc(pid).onSnapshot(snap=>{
    if(!snap.data()){setA(`<div class="loading"><div class="loading-t">Project not found.</div></div>`);return;}
    CP={id:snap.id,...snap.data()};
    applyTheme(CP.theme?.dark!==false);
    rP();
  },err=>setA(`<div class="loading"><div class="loading-t" style="color:#e07070">${err.message}</div></div>`));
}

function rP(){
  const p=CP,th=p.theme||{accent:'#c9383a',dark:true};
  const acc=th.accent||'#c9383a';
  document.documentElement.style.setProperty('--acc',acc);
  applyTheme(th.dark!==false);
  const dl=p.deadline?daysLeft(p.deadline):null;
  const tabLabel=NAV_ITEMS.find(t=>{
    if(TAB==='music'&&musicSub==='focus')return t.id==='focus';
    return t.id===TAB;
  })?.label||TAB;
  updateFab();
  setA(`<div style="min-height:100vh;background:var(--bg)">
    <div style="position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 85%,transparent);border-bottom:1px solid var(--bord)">
      <div style="display:flex;align-items:center;gap:6px;padding:36px 12px 12px">
        <button class="iBtn" onclick="${VO?"location.hash=''":"dash()"}" style="font-size:20px">←</button>
        <button class="iBtn" onclick="openNav()" style="font-size:20px">☰</button>
        <div style="flex:1;min-width:0;padding:0 4px">
          ${VO?`<span style="background:rgba(139,104,212,.15);color:#8b68d4;font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-bottom:4px;display:inline-block">View Only</span><br>`:''}
          <div style="font-size:9px;color:${acc};letter-spacing:.2em;text-transform:uppercase;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.artist||'Wavmancer'}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.05em;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${p.title||'Untitled'}</div>
        </div>
        ${p.coverUrl?`<img src="${p.coverUrl}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--bord)">`:''}
        ${!VO?`<button class="iBtn" onclick="shareM()" style="color:${acc};font-size:18px">⤴</button>`:''}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px">
        <div style="font-size:10px;color:${acc};letter-spacing:.18em;text-transform:uppercase;font-weight:500">${tabLabel}</div>
        ${dl!==null?`<div style="font-size:10px;color:${dl<0?'#e07070':dl<7?'#d4a843':'var(--muted)'}">${dl<0?`⚠ ${Math.abs(dl)}d over`:dl===0?'⚠ Today':dl===1?'Tomorrow':`${dl}d left`}</div>`:''}
      </div>
    </div>
    <div style="padding:14px;padding-bottom:96px">${bTab()}</div>
  </div>`);
  if(TAB==='music'&&musicSub==='songs')initDrag();
}

function sT(t){
  if(t==='focus'){TAB='music';musicSub='focus';}
  else{TAB=t;if(t==='music')musicSub=musicSub||'songs';}
  rP();
}
function toggleDark(){
  const th={...(CP.theme||{accent:'#c9383a',dark:true})};
  th.dark=!th.dark;
  db.collection('projects').doc(CID).update({theme:th});
}

/* ── TAB CONTENT ── */
function bTab(){
  const p=CP,songs=p.songs||[],acc=p.theme?.accent||'#c9383a',fd=p.focusDone||{};

  /* OVERVIEW */
  if(TAB==='overview'){
    const dn=songs.filter(s=>(s.tasks||[]).every(t=>t.done)&&(s.tasks||[]).length>0).length;
    const ac=songs.filter(s=>!(s.tasks||[]).every(t=>t.done)&&(s.tasks||[]).some(t=>t.done)).length;
    const qu=songs.filter(s=>(s.tasks||[]).length===0||(s.tasks||[]).every(t=>!t.done)).length;
    const pct=songs.length?Math.round(dn/songs.length*100):0;
    const dl=p.deadline?daysLeft(p.deadline):null;
    const ms=(p.milestones||[]).filter(m=>m.done).length,mst=(p.milestones||[]).length;
    const pt=(p.promoTasks||[]).filter(t=>t.done).length,ptt=(p.promoTasks||[]).length;
    const ct=(p.contentTasks||[]).filter(t=>t.done).length,ctt=(p.contentTasks||[]).length;
    const td=(p.todoTasks||[]).filter(t=>t.done).length,tdt=(p.todoTasks||[]).length;
    return `
    ${dl!==null?`<div class="card" style="margin-bottom:12px;border-left:3px solid ${dl<0?'#e07070':dl<7?'#d4a843':acc}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="flabel" style="margin-bottom:5px">Release Deadline</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:${dl<0?'#e07070':dl<7?'#d4a843':acc}">${dl<0?`${Math.abs(dl)} DAYS OVERDUE`:dl===0?'DUE TODAY':dl===1?'DUE TOMORROW':`${dl} DAYS LEFT`}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">${fmtDate(p.deadline)}</div>
        </div>
        <div style="font-size:40px;opacity:.15">${dl<0?'⚠':'📅'}</div>
      </div>
    </div>`:''}
    <div class="card" style="margin-bottom:12px">
      <div class="slabel">Music Progress</div>
      <div class="stat-grid">
        ${[{n:songs.length,l:'Songs',c:'var(--text)'},{n:dn,l:'Done',c:'#4caf82'},{n:ac,l:'Active',c:acc},{n:qu,l:'Queued',c:'var(--muted)'}].map(x=>`
        <div class="stat-box"><div class="stat-num" style="color:${x.c}">${x.n}</div><div class="stat-lbl">${x.l}</div></div>`).join('')}
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${acc}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)"><span>${dn} of ${songs.length} complete</span><span>${pct}%</span></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      ${[[`Promo`,pt,ptt,'#e07b3a','promo'],[`Content`,ct,ctt,'#8b68d4','content'],[`To-Do`,td,tdt,'#4a8fc4','todo'],[`Milestones`,ms,mst,'#8b68d4','info']].map(([l,d,t,c,tab])=>`
      <div class="mini-stat" onclick="sT('${tab}')">
        <div class="flabel" style="margin-bottom:6px">${l}</div>
        <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:7px">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:${c};line-height:1">${d}</span>
          <span style="font-size:10px;color:var(--muted)">/ ${t}</span>
        </div>
        <div class="progress-bar" style="height:3px;margin:0"><div class="progress-fill" style="width:${t?Math.round(d/t*100):0}%;background:${c}"></div></div>
      </div>`).join('')}
    </div>
    <div class="slabel">Songs</div>
    ${songs.length?songs.map((s,i)=>mCard(s,i,acc)).join(''):'<div class="empty">No songs yet.<br><small>Go to Songs tab to add.</small></div>'}`;
  }

  /* MUSIC (songs + focus subtabs) */
  if(TAB==='music'){
    return `<div style="display:flex;gap:8px;margin-bottom:14px">
      <button onclick="musicSub='songs';rP()" style="flex:1;padding:9px 6px;background:${musicSub==='songs'?acc:'var(--surf2)'};color:${musicSub==='songs'?'#fff':'var(--muted)'};border:1px solid ${musicSub==='songs'?acc:'var(--bord)'};border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s">Songs</button>
      <button onclick="musicSub='focus';rP()" style="flex:1;padding:9px 6px;background:${musicSub==='focus'?'#d4a843':'var(--surf2)'};color:${musicSub==='focus'?'var(--bg)':'var(--muted)'};border:1px solid ${musicSub==='focus'?'#d4a843':'var(--bord)'};border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s">Focus</button>
    </div>
    ${musicSub==='songs'?`
      ${!VO?`<button class="btn-o" onclick="addSongM()" style="margin-bottom:14px">+ Add Song</button>`:''}
      <div id="song-list">${songs.length?songs.map((s,i)=>sCard(s,i,acc)).join(''):'<div class="empty">No songs yet.</div>'}</div>`
    :`<div class="slabel">Next Up</div>
      ${songs.filter(s=>!(s.tasks||[]).every(t=>t.done)).length===0?`<div class="empty" style="color:#4caf82">🎉 All songs complete!</div>`:''}
      ${songs.filter(s=>!(s.tasks||[]).every(t=>t.done)).map((song,i)=>{
        const nx=(song.tasks||[]).filter(t=>!t.done).slice(0,3);
        return `<div class="card" style="display:flex;gap:12px;margin-bottom:8px;animation:fadeUp .25s ease ${i*.05}s backwards">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:${acc};line-height:1;min-width:24px;opacity:.7">${i+1}</div>
          <div style="flex:1">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:19px;margin-bottom:8px;color:var(--text)">${song.name}</div>
            ${nx.map(task=>{const fk=song.id+'_'+task.id,d=fd[fk];
              return `<div ${!VO?`onclick="tF('${fk}')"`:''}
                style="display:flex;align-items:center;gap:8px;font-size:11px;color:${d?'var(--muted)':'var(--text2)'};text-decoration:${d?'line-through':'none'};padding:6px 0;cursor:${VO?'default':'pointer'};border-bottom:1px solid var(--bord)">
                <span style="color:${d?'#4caf82':acc};font-size:12px;flex-shrink:0">${d?'✓':'→'}</span>${task.text}</div>`;
            }).join('')}
            ${nx.length===0?`<div style="font-size:10px;color:#4caf82">All tasks complete ✓</div>`:''}
          </div>
        </div>`;
      }).join('')}`}`;
  }

  /* RELEASE SCHEDULE */
  if(TAB==='release'){
    const rs=p.releaseSchedule||[];
    const statusColors={'Not Started':'var(--muted)','In Progress':'#d4a843','Complete':'#4caf82','Overdue':'#e07070'};
    return `${rs.length?`<div class="rel-wrap">
      <table class="rel-table">
        <thead><tr><th>Release</th><th>Release Date</th><th>Due Date</th><th>Audio</th><th>Art</th><th>Meta</th><th>Status</th>${!VO?'<th></th>':''}</tr></thead>
        <tbody>${rs.map(row=>{
          const sc=statusColors[row.status]||'var(--muted)';
          const dl=row.releaseDate?daysLeft(row.releaseDate):null;
          const chipBg=(v)=>v==='Done'?'rgba(76,175,130,.15)':v==='In Progress'?'rgba(212,168,67,.12)':'var(--surf2)';
          const chipCol=(v)=>v==='Done'?'#4caf82':v==='In Progress'?'#d4a843':'var(--muted)';
          return `<tr>
            <td><strong style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.03em">${row.release||'—'}</strong></td>
            <td style="color:${dl!==null&&dl<7?'#e07070':'var(--text2)'};font-size:11px">${row.releaseDate?fmtDateShort(row.releaseDate):'—'}</td>
            <td style="color:var(--muted);font-size:11px">${row.dueDate?fmtDateShort(row.dueDate):'—'}</td>
            <td><span class="rel-chip" style="background:${chipBg(row.audioFile)};color:${chipCol(row.audioFile)}">${row.audioFile||'—'}</span></td>
            <td><span class="rel-chip" style="background:${chipBg(row.artwork)};color:${chipCol(row.artwork)}">${row.artwork||'—'}</span></td>
            <td><span class="rel-chip" style="background:${chipBg(row.metadata)};color:${chipCol(row.metadata)}">${row.metadata||'—'}</span></td>
            <td><span class="rel-chip" style="background:${sc}18;color:${sc};border:1px solid ${sc}30">${row.status||'Not Started'}</span></td>
            ${!VO?`<td style="white-space:nowrap"><button onclick="editReleaseRowM('${row.id}')" class="iBtn" style="font-size:14px;padding:4px">✎</button><button onclick="delReleaseRow('${row.id}')" class="iBtn" style="font-size:12px;padding:4px;opacity:.4">✕</button></td>`:''}
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`:''}
    ${!rs.length?`<div class="empty">No releases scheduled yet.${!VO?'<br>Tap + to add your first row.':''}</div>`:''}
    ${!VO?`<button class="btn-o" onclick="addReleaseRowM()" style="margin-top:4px">+ Add Row</button>`:''}`;
  }

  /* PROMO / CONTENT / TODO — shared renderer */
  if(['promo','content','todo'].includes(TAB)){
    const cfg={
      promo:{field:'promoTasks',label:'Promo & Photos',color:acc,inputId:'pt-inp',placeholder:'Add promo task...'},
      content:{field:'contentTasks',label:'Content Plan',color:'#8b68d4',inputId:'ct-inp',placeholder:'Add content task...'},
      todo:{field:'todoTasks',label:'General To-Do',color:'#4a8fc4',inputId:'td-inp',placeholder:'Add to-do...'},
    }[TAB];
    const tasks=p[cfg.field]||[];
    const dn=tasks.filter(t=>t.done).length;
    const pct=tasks.length?Math.round(dn/tasks.length*100):0;
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="slabel" style="margin:0;border:none;padding:0">${cfg.label}</div>
      <span style="font-size:10px;color:var(--muted)">${dn}/${tasks.length} done</span>
    </div>
    <div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" style="width:${pct}%;background:${cfg.color}"></div></div>
    ${!VO?`<div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="field" id="${cfg.inputId}" placeholder="${cfg.placeholder}" style="flex:1;margin:0" onkeydown="if(event.key==='Enter')addSimpleTask('${cfg.field}','${cfg.inputId}')">
      <button class="btn-s" onclick="addSimpleTask('${cfg.field}','${cfg.inputId}')" style="background:${cfg.color}">Add</button>
    </div>`:''}
    ${tasks.length?tasks.map(t=>`<div class="trow" ${!VO?`onclick="toggleSimpleTask('${cfg.field}','${t.id}')"`:''}  style="cursor:${VO?'default':'pointer'}">
      <div class="tcheck${t.done?' on':''}" style="${t.done?'':`border-color:${cfg.color}40`}"></div>
      <div style="font-size:12px;line-height:1.5;flex:1;color:${t.done?'var(--muted)':'var(--text)'};text-decoration:${t.done?'line-through':'none'}">${t.text}</div>
      ${!VO?`<button onclick="event.stopPropagation();delSimpleTask('${cfg.field}','${t.id}')" class="iBtn" style="font-size:12px;padding:2px 6px;opacity:.35">✕</button>`:''}
    </div>`).join(''):'<div class="empty">Nothing here yet.<br><small>Add your first item above.</small></div>'}`;
  }

  /* BUDGET */
  if(TAB==='budget'){
    const expenses=p.expenses||[];
    const total=expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    const byCategory={};
    expenses.forEach(e=>{const c=e.category||'Other';byCategory[c]=(byCategory[c]||0)+(parseFloat(e.amount)||0);});
    return `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px">
      <div>
        <div class="flabel">Total Spent</div>

/* ── DRAG ── */
function initDrag(){
  document.querySelectorAll('.scard').forEach(el=>{
    el.addEventListener('touchstart',e=>{if(!e.target.classList.contains('drag-handle'))return;e.preventDefault();dragSrc=el.id.replace('sc-','');el.classList.add('dragging');},{passive:false});
  });
}
function dStart(e,id){dragSrc=id;e.dataTransfer.effectAllowed='move';}
function dOver(e,id){e.preventDefault();if(dragSrc&&dragSrc!==id){document.querySelectorAll('.scard').forEach(c=>c.classList.remove('drag-over'));const t=document.getElementById('sc-'+id);if(t)t.classList.add('drag-over');}}
function dEnd(){dragSrc=null;document.querySelectorAll('.scard').forEach(c=>{c.classList.remove('dragging');c.classList.remove('drag-over');});}
async function dDrop(e,tid){
  e.preventDefault();if(!dragSrc||dragSrc===tid)return;
  const songs=[...(CP.songs||[])];
  const fi=songs.findIndex(s=>s.id===dragSrc),ti=songs.findIndex(s=>s.id===tid);
  if(fi<0||ti<0)return;
  const [m]=songs.splice(fi,1);songs.splice(ti,0,m);
  songs.forEach((s,idx)=>s.order=idx+1);
  await db.collection('projects').doc(CID).update({songs});dEnd();
}

/* ── ACTIONS ── */
function tC(id){OC[id]=!OC[id];rP();}
async function tT(sid,tid){
  const songs=[...(CP.songs||[])];
  const si=songs.findIndex(s=>s.id===sid);if(si<0)return;
  const ti=songs[si].tasks.findIndex(t=>t.id===tid);if(ti<0)return;
  songs[si].tasks[ti].done=!songs[si].tasks[ti].done;
  await db.collection('projects').doc(CID).update({songs});
}
async function tF(fk){const fd={...(CP.focusDone||{})};fd[fk]=!fd[fk];await db.collection('projects').doc(CID).update({focusDone:fd});}
async function aT(sid){
  const inp=document.getElementById('ni-'+sid);
  const text=inp?.value?.trim();if(!text)return;
  const songs=[...(CP.songs||[])];
  const si=songs.findIndex(s=>s.id===sid);if(si<0)return;
  songs[si].tasks=[...(songs[si].tasks||[]),{id:'t'+Date.now(),text,done:false}];
  await db.collection('projects').doc(CID).update({songs});
  if(inp)inp.value='';
}
async function dT(sid,tid){const songs=[...(CP.songs||[])];const si=songs.findIndex(s=>s.id===sid);if(si<0)return;songs[si].tasks=songs[si].tasks.filter(t=>t.id!==tid);await db.collection('projects').doc(CID).update({songs});}
async function dS(sid){if(!confirm('Delete this song?'))return;await db.collection('projects').doc(CID).update({songs:(CP.songs||[]).filter(s=>s.id!==sid)});}

function addReleaseRowM(existingId){
  const row=existingId?(CP.releaseSchedule||[]).find(r=>r.id===existingId):null;
  const sel=(id,val,opts)=>`<select class="field" id="${id}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
  SM(`<div class="modal-title">${row?'Edit':'Add'} Release</div>
    <input class="field" id="rr-rel" value="${esc(row?.release||'')}" placeholder="Release name (e.g. Single, Full EP)" autofocus>
    <div class="flabel">Release Date</div>
    <input class="field" id="rr-rd" type="date" value="${row?.releaseDate||''}">
    <div class="flabel">Due / Delivery Date</div>
    <input class="field" id="rr-dd" type="date" value="${row?.dueDate||''}">
    <div class="flabel">Audio File</div>${sel('rr-af',row?.audioFile||'—',['—','Pending','In Progress','Done'])}
    <div class="flabel">Artwork</div>${sel('rr-aw',row?.artwork||'—',['—','Pending','In Progress','Done'])}
    <div class="flabel">Metadata</div>${sel('rr-md',row?.metadata||'—',['—','Pending','In Progress','Done'])}
    <div class="flabel">Overall Status</div>${sel('rr-st',row?.status||'Not Started',['Not Started','In Progress','Complete','Overdue'])}
    <div class="mactions">
      <button class="btn-g" onclick="CM()">Cancel</button>
      <button class="btn-p" style="width:auto;padding:10px 22px" onclick="saveReleaseRow('${existingId||''}')">Save</button>
    </div>`);
}
function editReleaseRowM(id){addReleaseRowM(id);}
async function saveReleaseRow(existingId){
  const rs=[...(CP.releaseSchedule||[])];
  const row={id:existingId||'r'+Date.now(),release:g('rr-rel'),releaseDate:document.getElementById('rr-rd').value||null,dueDate:document.getElementById('rr-dd').value||null,audioFile:document.getElementById('rr-af').value,artwork:document.getElementById('rr-aw').value,metadata:document.getElementById('rr-md').value,status:document.getElementById('rr-st').value};
  if(existingId){const i=rs.findIndex(r=>r.id===existingId);if(i>=0)rs[i]=row;else rs.push(row);}else rs.push(row);
  await db.collection('projects').doc(CID).update({releaseSchedule:rs});CM();
}
async function delReleaseRow(id){await db.collection('projects').doc(CID).update({releaseSchedule:(CP.releaseSchedule||[]).filter(r=>r.id!==id)});}

/* ── MILESTONES ── */
function addMilestoneM(){
  SM(`<div class="modal-title">Add Milestone</div>
    <input class="field" id="ml" placeholder="e.g. Sent to mastering, Label approved..." autofocus>
    <div class="flabel">Target Date (optional)</div>
    <input class="field" id="md" type="date">
    <div class="mactions">
      <button class="btn-g" onclick="CM()">Cancel</button>
      <button class="btn-p" style="width:auto;padding:10px 22px" onclick="addMilestone()">Add</button>
    </div>`);
}
async function addMilestone(){const label=g('ml');if(!label)return;const milestones=[...(CP.milestones||[])];milestones.push({id:'m'+Date.now(),label,date:document.getElementById('md').value||null,done:false});await db.collection('projects').doc(CID).update({milestones});CM();}
async function toggleMilestone(mid){const ms=[...(CP.milestones||[])];const i=ms.findIndex(m=>m.id===mid);if(i<0)return;ms[i].done=!ms[i].done;await db.collection('projects').doc(CID).update({milestones:ms});}
async function delMilestone(mid){await db.collection('projects').doc(CID).update({milestones:(CP.milestones||[]).filter(m=>m.id!==mid)});}

/* ── BUDGET ── */
function addExpModal(){document.querySelector('#exp-amt')?.focus();}
async function addExp(){
  const amt=document.getElementById('exp-amt')?.value?.trim();
  const desc=document.getElementById('exp-desc')?.value?.trim();
  const cat=document.getElementById('exp-cat')?.value?.trim();
  if(!amt||!desc)return;
  const expenses=[...(CP.expenses||[])];
  expenses.push({id:'e'+Date.now(),amount:parseFloat(amt),desc,category:cat||'Other',date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})});
  await db.collection('projects').doc(CID).update({expenses});
  ['exp-amt','exp-desc','exp-cat'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}
async function delExp(eid){await db.collection('projects').doc(CID).update({expenses:(CP.expenses||[]).filter(e=>e.id!==eid)});}

/* ── SIMPLE TASKS ── */
async function addSimpleTask(field,inputId,fromFab){
  if(fromFab){
    const inp=document.getElementById(inputId);
    if(inp)inp.focus();
    return;
  }
  const inp=document.getElementById(inputId);const text=inp?.value?.trim();if(!text)return;
  const tasks=[...(CP[field]||[])];tasks.push({id:'t'+Date.now(),text,done:false});
  await db.collection('projects').doc(CID).update({[field]:tasks});if(inp)inp.value='';
}
async function toggleSimpleTask(field,tid){
  const tasks=[...(CP[field]||[])];const i=tasks.findIndex(t=>t.id===tid);if(i<0)return;
  tasks[i].done=!tasks[i].done;await db.collection('projects').doc(CID).update({[field]:tasks});
}
async function delSimpleTask(field,tid){await db.collection('projects').doc(CID).update({[field]:(CP[field]||[]).filter(t=>t.id!==tid)});}

/* ── DELETE PROJECT ── */
async function deleteProject(){
  if(!confirm('Delete this project? This cannot be undone.'))return;
  if(!confirm('Final confirmation — all data will be lost.'))return;
  stopL();await db.collection('projects').doc(CID).delete();dash();
}

/* ── SHARE ── */
function shareM(){
  const link=location.origin+location.pathname+'#/view/'+CID;
  SM(`<div class="modal-title">Share Project</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6">Anyone with this link can view your project (read only). Views are tracked in Insights.</div>
    <div style="background:var(--surf2);border:1px solid var(--bord);border-radius:8px;padding:12px 14px;font-size:11px;word-break:break-all;margin-bottom:14px;color:var(--text);line-height:1.5">${link}</div>
    <button class="btn-p" id="cbtn" onclick="cpL('${link}')">Copy Link</button>
    <div class="mactions"><button class="btn-g" onclick="CM()">Close</button></div>`);
}
function cpL(l){navigator.clipboard.writeText(l).then(()=>{const b=document.getElementById('cbtn');if(b){b.textContent='✓ Copied!';setTimeout(()=>b.textContent='Copy Link',2000);}});}

/* ── SETTINGS ── */
let _th={},_pf=null;
function settingsM(){
  const p=CP;_th={...(p.theme||{accent:'#c9383a',dark:true})};_pf=null;
  const ACCS=['#c9383a','#e07b3a','#d4a843','#4caf82','#4a8fc4','#8b68d4','#e84393','#e8584a'];
  const BGS_DARK=['#0a0a0c','#0d0d1a','#0a0d0a','#1a0808','#0d0a14'];
  const BGS_LIGHT=['#f2f1ee','#ffffff','#f0f4f8','#fff8f0','#f5f0ff'];
  SM(`<div class="modal-title">Settings</div>
    <div class="flabel">Cover Photo</div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <div id="cprev" style="width:68px;height:68px;border-radius:10px;background:var(--surf2);border:1px solid var(--bord);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">
        ${p.coverUrl?`<img src="${p.coverUrl}" style="width:100%;height:100%;object-fit:cover">`:'♪'}
      </div>
      <div>
        <input type="file" id="cfile" accept="image/*" style="display:none" onchange="pCov(this)">
        <button class="btn-s o" onclick="document.getElementById('cfile').click()">Upload Photo</button>
        <div style="font-size:10px;color:var(--muted);margin-top:5px">Square crop recommended</div>
      </div>
    </div>
    <div class="flabel">Accent Color</div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
      ${ACCS.map(c=>`<div onclick="sA('${c}')" style="width:30px;height:30px;border-radius:50%;background:${c};cursor:pointer;border:${_th.accent===c?'3px solid var(--text)':'2px solid var(--bord)'};flex-shrink:0;transition:transform .15s" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"></div>`).join('')}
      <input type="color" value="${_th.accent}" oninput="sA(this.value)" style="width:30px;height:30px;border-radius:50%;border:2px solid var(--bord);cursor:pointer;padding:2px;background:none">
    </div>
    <div class="flabel">Background (Dark Mode)</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      ${BGS_DARK.map(c=>`<div onclick="sBg('${c}')" style="width:30px;height:30px;border-radius:6px;background:${c};cursor:pointer;border:${_th.bg===c?'3px solid var(--text)':'2px solid var(--bord)'};flex-shrink:0"></div>`).join('')}
    </div>
    <div class="flabel">Background (Light Mode)</div>
    <div style="display:flex;gap:8px;margin-bottom:18px;align-items:center">
      ${BGS_LIGHT.map(c=>`<div onclick="sBg('${c}')" style="width:30px;height:30px;border-radius:6px;background:${c};border:${_th.bg===c?'3px solid #333':'2px solid var(--bord)'};cursor:pointer;flex-shrink:0"></div>`).join('')}
      <input type="color" value="${_th.bg||'#0a0a0c'}" oninput="sBg(this.value)" style="width:30px;height:30px;border-radius:6px;border:2px solid var(--bord);cursor:pointer;padding:2px;background:none">
    </div>
    <div class="flabel">Project Info</div>
    <input class="field" id="stitle" value="${esc(p.title||'')}" placeholder="Project title">
    <input class="field" id="sartist" value="${esc(p.artist||'')}" placeholder="Artist name">
    <input class="field" id="slabel" value="${esc(p.label||'')}" placeholder="Label">
    <input class="field" id="scoprod" value="${esc(p.coproducer||'')}" placeholder="Co-producer">
    <div class="flabel" style="margin-top:4px">Release Deadline</div>
    <input class="field" id="sdl" type="date" value="${p.deadline||''}">
    <div class="err" id="serr"></div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--bord)">
      <div class="flabel" style="color:#e07070">Danger Zone</div>
      <button class="btn-s d" onclick="CM();deleteProject()" style="width:100%;padding:11px">Delete This Project</button>
    </div>
    <div class="mactions">
      <button class="btn-g" onclick="CM()">Cancel</button>
      <button class="btn-p" style="width:auto;padding:10px 22px" onclick="savSet()">Save</button>
    </div>`);
}
function pCov(inp){_pf=inp.files[0];if(!_pf)return;const r=new FileReader();r.onload=e=>{const el=document.getElementById('cprev');if(el)el.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;};r.readAsDataURL(_pf);}
function sA(c){_th.accent=c;}
function sBg(c){_th.bg=c;}
async function savSet(){
  try{
    let cu=CP.coverUrl||null;
    if(_pf){const ref=stor.ref(`covers/${CID}/${Date.now()}`);await ref.put(_pf);cu=await ref.getDownloadURL();}
    const dark=_th.dark!==false;
    // Set bg based on dark/light if not explicitly set
    if(!_th.bg)_th.bg=dark?'#0a0a0c':'#f2f1ee';
    await db.collection('projects').doc(CID).update({theme:{..._th},coverUrl:cu,title:g('stitle')||CP.title,artist:g('sartist'),label:g('slabel'),coproducer:g('scoprod'),deadline:document.getElementById('sdl').value||null});CM();
  }catch(e){sErr('serr','Error: '+e.message);}
}

/* ── INSIGHTS ── */
async function logView(pid){
  try{
    const now=new Date();
    const timeStr=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const ts=now.getTime();
    let name=null,location='Unknown location';
    if(auth.currentUser){name=auth.currentUser.displayName||auth.currentUser.email;}
    try{const r=await fetch(`https://ipinfo.io/json?token=${IPINFO_TOKEN}`);const d=await r.json();if(d.city&&d.region)location=d.city+', '+d.region;else if(d.country)location=d.country;}catch(e){}
    const snap=await db.collection('projects').doc(pid).get();
    const views=snap.data()?.views||[];views.push({id:'v'+ts,ts,timeStr,name,location});
    await db.collection('projects').doc(pid).update({views});
  }catch(e){}
}

/* ── UTILS ── */
function setA(h){document.getElementById('app').innerHTML=h;}
function SM(h){document.getElementById('modal-box').innerHTML=h;document.getElementById('modal-ov').style.display='flex';}
function CM(){document.getElementById('modal-ov').style.display='none';}
function sErr(id,msg){const e=document.getElementById(id);if(e){e.textContent=msg;e.style.display='block';}}
function g(id){return document.getElementById(id)?.value?.trim()||'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stopL(){if(PL){PL();PL=null;}}
function SO(){stopL();auth.signOut().then(()=>{location.hash='';applyTheme(true);authScreen();});}
function fE(c){return({'auth/email-already-in-use':'Email already in use.','auth/invalid-email':'Invalid email.','auth/wrong-password':'Wrong password.','auth/user-not-found':'No account with that email.','auth/weak-password':'Password must be 6+ characters.','auth/invalid-credential':'Invalid email or password.','auth/popup-closed-by-user':'Sign-in cancelled.'})[c]||'Something went wrong. Try again.';}
function daysLeft(d){if(!d)return null;const dt=new Date(d+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((dt-t)/864e5);}
function fmtDate(d){if(!d)return '';try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}catch(e){return d;}}
function fmtDateShort(d){if(!d)return '';try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
